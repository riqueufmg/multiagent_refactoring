project:
  name: accumulo
  repo_path: /data/henrique/historical-java-repro/benchmark/repositories/accumulo/repository
runs: 5
target:
  smell: GC
  smell_name: God Component
  target_type: package
  target_name: org.apache.accumulo.core.fate.zookeeper
planner:
  base_config: /data/henrique/historical-java-repro/benchmark/repositories/accumulo/commits/a96fe3b2abc6/planner_mars.yml
  prompts:
    smell: ${MARS_ROOT}/mvp/planner/prompts/planner_GC.md
  designite:
    smells_csv: ArchitectureSmells.csv
source_refactor:
  base_config: /data/henrique/multiagent_refactoring/mvp/source_refactor/config.yml
  compile:
    timeout: 900
    command:
    - /data/henrique/historical-java-repro/benchmark/repositories/accumulo/commits/a96fe3b2abc6/build_mars.sh
  mechanical_tools:
    openrewrite_enabled: true
    openrewrite_timeout: 900
    openrewrite_command:
    - /data/henrique/historical-java-repro/benchmark/repositories/accumulo/commits/a96fe3b2abc6/openrewrite_mars_online.sh
quality_checker:
  base_config: /data/henrique/multiagent_refactoring/mvp/quality_checker/config.yml
output:
  runs_dir: /data/henrique/multiagent_refactoring/data/runs
