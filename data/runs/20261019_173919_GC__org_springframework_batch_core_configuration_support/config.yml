project:
  name: spring-batch
  repo_path: /data/henrique/historical-java-repro/benchmark/repositories/spring-batch/repository
runs: 5
target:
  smell: GC
  smell_name: God Component
  target_type: package
  target_name: org.springframework.batch.core.configuration.support
planner:
  base_config: /data/henrique/historical-java-repro/benchmark/repositories/spring-batch/commits/667a92e9451e/planner_mars.yml
source_refactor:
  base_config: /data/henrique/multiagent_refactoring/mvp/source_refactor/config.yml
  compile:
    timeout: 900
    command:
    - /data/henrique/historical-java-repro/benchmark/repositories/spring-batch/commits/667a92e9451e/build_mars.sh
  mechanical_tools:
    openrewrite_enabled: true
    openrewrite_timeout: 900
    openrewrite_command:
    - /data/henrique/historical-java-repro/benchmark/repositories/spring-batch/commits/667a92e9451e/openrewrite_mars_online.sh
quality_checker:
  base_config: /data/henrique/multiagent_refactoring/mvp/quality_checker/config.yml
output:
  runs_dir: /data/henrique/multiagent_refactoring/data/runs
